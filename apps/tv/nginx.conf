server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Gutshot-App tv always;

    # Docker embedded DNS — иначе после recreate api остаётся старый IP → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;
    # Полный URL board.html — с переменными нельзя резать URI суффиксом /api/.
    set $board_html http://gutshot-api:3000/api/v1/public/tournaments/board.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Статика табло (логотип и т.п.)
    location = /gutshot-logo.png {
        try_files /gutshot-logo.png =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Gutshot-App tv always;
    }

    location = /favicon.ico {
        try_files /gutshot-logo.png =204;
        access_log off;
    }

    # Главная страница табло — HTML с сервера.
    location = / {
        proxy_pass $board_html$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Gutshot-App tv always;
    }

    location = /index.html {
        proxy_pass $board_html$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Gutshot-App tv always;
    }

    # Любые чужие пути (/login и т.п.) — сразу на табло, без SPA-циклов.
    location / {
        return 302 /;
    }
}
