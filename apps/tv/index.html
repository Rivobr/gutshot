<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Табло турнира</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #090907;
        color: #f7d98a;
        font-family: sans-serif;
      }
      .boot {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .logo {
        display: inline-flex;
        align-items: flex-end;
        gap: 10px;
        height: 56px;
      }
      .logo .bar {
        width: 12px;
        height: 56px;
        border-radius: 4px;
        background: linear-gradient(150deg, #7d5417 0%, #c89a3d 42%, #f7d98a 58%, #8a5c1c 100%);
      }
      .logo .bar.ruby {
        background: linear-gradient(150deg, #7a0b2c 0%, #e0115f 45%, #ff4d7d 60%, #a10d3d 100%);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="logo" aria-hidden="true">
          <span class="bar"></span><span class="bar"></span><span class="bar ruby"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <div style="opacity: 0.7; letter-spacing: 0.08em; font-weight: 400">Загрузка табло…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
