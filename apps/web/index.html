<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="GUTSHOT — клуб спортивного покера в Санкт-Петербурге. Миллионная, 19. Турниры, рейтинг, финал месяца." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GUTSHOT" />
    <title>GUTSHOT — Poker Club · Санкт-Петербург</title>
    <style>
      html, body { margin: 0; background: #090909; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 999;
        display: flex; align-items: center; justify-content: center;
        background: #090909 radial-gradient(ellipse at 50% 35%, rgba(200,154,61,.12) 0%, transparent 58%);
      }
      #boot-splash img {
        width: min(60vw, 260px); filter: drop-shadow(0 8px 28px rgba(200,154,61,.25));
        animation: boot-pulse 2.2s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%,100% { opacity:.85; transform: scale(.985);} 50% { opacity:1; transform: scale(1);} }
    </style>
  </head>
  <body>
    <div id="boot-splash"><img src="/gutshot-logo.png" alt="GUTSHOT" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
