<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090909" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GUTSHOT" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <title>GUTSHOT Poker Club — Admin</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #090909;
        color: #f5edd6;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      #boot-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      #boot-fallback[hidden] {
        display: none !important;
      }
      #boot-fallback p {
        margin: 0;
        color: #a09078;
      }
      #boot-fallback button {
        margin-top: 16px;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: #d8b36a;
        color: #090909;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div>
          <p id="boot-text">Загрузка GUTSHOT CRM…</p>
          <button id="boot-reload" type="button" hidden>Обновить страницу</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var text = document.getElementById('boot-text');
        var reload = document.getElementById('boot-reload');
        if (!text || !reload) return;
        window.setTimeout(function () {
          if (!document.getElementById('boot-fallback')) return;
          text.textContent =
            'Панель не загрузилась. Обычно помогает обновить страницу или сбросить кэш сайта.';
          reload.hidden = false;
          reload.onclick = function () {
            window.location.reload();
          };
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
