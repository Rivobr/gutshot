<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="gutshot-app" content="mini-app" />
    <title>GUTSHOT Poker Club</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #000;
      }
      #boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000;
        color: #8A7A62;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      #boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(199,154,61,0.12);
      }
      #boot-bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, transparent, #C89A3D, transparent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
    </style>
    <!--
      Снимаем нативный скелетон Telegram сразу, без блокирующей загрузки
      telegram.org/js/telegram-web-app.js. Внутри Telegram bridge уже инжектится
      клиентом; внешний sync-скрипт на части сетей/WebView зависает навечно
      и оставляет «четыре квадрата» вместо чёрного boot-экрана.
    -->
    <script>
      (function () {
        var APP_BG = '#090909';

        function bootTelegram() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) {
              return false;
            }
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor(APP_BG);
            if (tg.setBackgroundColor) tg.setBackgroundColor(APP_BG);
            return true;
          } catch (e) {
            return false;
          }
        }

        if (bootTelegram()) {
          return;
        }

        // На части клиентов bridge появляется чуть позже первого тика.
        var attempts = 0;
        var timer = setInterval(function () {
          attempts += 1;
          if (bootTelegram() || attempts >= 50) {
            clearInterval(timer);
          }
        }, 20);

        // Вне Telegram (обычный браузер) подгружаем SDK асинхронно — только для отладки.
        // Внутри Mini App этот файл не нужен и не должен блокировать первый кадр.
        if (!(window.Telegram && window.Telegram.WebApp)) {
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          s.async = true;
          s.onload = function () {
            bootTelegram();
          };
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span>GUTSHOT</span>
        <div id="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
