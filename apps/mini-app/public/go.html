<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>GUTSHOT</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #s {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #c9a227;
        border-radius: 50%;
        animation: r 0.8s linear infinite;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }
      .msg {
        font-size: 14px;
        opacity: 0.75;
      }
    </style>
    <script>
      (function () {
        try {
          if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
          }
        } catch (e) {}
        // Immediate redirect — no health fetch (fetch itself can hang on flaky TLS).
        location.replace("/t.html?from=go&t=" + Date.now());
      })();
    </script>
  </head>
  <body>
    <div id="s">
      <div class="logo">GUTSHOT</div>
      <div class="spin"></div>
      <div class="msg">Открываем…</div>
    </div>
  </body>
</html>
