<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>GUTSHOT</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #090909;
        color: #c9a227;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #s {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #f5f5f5;
      }
      .msg {
        font-size: 14px;
        opacity: 0.85;
        max-width: 280px;
        line-height: 1.4;
      }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #c9a227;
        border-radius: 50%;
        animation: r 0.8s linear infinite;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        display: none;
        margin-top: 8px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #c9a227;
        color: #111;
        font-weight: 700;
        font-size: 15px;
      }
      .btn.show {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="s">
      <div class="logo">GUTSHOT</div>
      <div class="spin" id="sp"></div>
      <div class="msg" id="m">Входим…</div>
      <button class="btn" id="b" type="button">Повторить</button>
    </div>
    <script>
      (function () {
        var TOKEN_KEY = "gutshot_access_token";
        var APP = "/t.html?from=boot&t=" + Date.now();
        var m = document.getElementById("m");
        var b = document.getElementById("b");
        var sp = document.getElementById("sp");
        var done = false;

        function goApp() {
          if (done) return;
          done = true;
          location.replace(APP);
        }

        function fail(text) {
          sp.style.display = "none";
          m.textContent = text;
          b.classList.add("show");
        }

        function readyTg() {
          try {
            var tg = window.Telegram && Telegram.WebApp;
            if (!tg) return null;
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor("#090909");
            if (tg.setBackgroundColor) tg.setBackgroundColor("#090909");
            return tg;
          } catch (e) {
            return null;
          }
        }

        function getInitData() {
          try {
            return (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || "";
          } catch (e) {
            return "";
          }
        }

        function login(initData, attempt) {
          attempt = attempt || 1;
          m.textContent = attempt > 1 ? "Повтор входа… " + attempt : "Входим…";
          return fetch("/api/v1/auth/telegram", {
            method: "POST",
            cache: "no-store",
            credentials: "omit",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: initData }),
          }).then(function (r) {
            if (!r.ok) throw new Error("http " + r.status);
            return r.json();
          }).then(function (json) {
            var token = json && json.data && json.data.accessToken;
            if (!token) throw new Error("no token");
            try {
              localStorage.setItem(TOKEN_KEY, token);
            } catch (e) {}
            m.textContent = "Открываем клуб…";
            goApp();
          }).catch(function () {
            if (attempt < 4) {
              return new Promise(function (resolve) {
                setTimeout(resolve, 400 * attempt);
              }).then(function () {
                return login(initData, attempt + 1);
              });
            }
            // Даже без токена пробуем открыть SPA — там свой retry.
            fail("Нет связи для входа. Можно открыть клуб и повторить там.");
            b.textContent = "Открыть клуб";
            b.onclick = goApp;
            b.classList.add("show");
            sp.style.display = "none";
          });
        }

        b.onclick = function () {
          sp.style.display = "block";
          b.classList.remove("show");
          start();
        };

        function start() {
          readyTg();
          var tries = 0;
          var timer = setInterval(function () {
            tries += 1;
            readyTg();
            var initData = getInitData();
            if (initData) {
              clearInterval(timer);
              login(initData);
              return;
            }
            if (tries >= 40) {
              clearInterval(timer);
              // Нет initData — всё равно открываем SPA (кэш токена / свой boot).
              goApp();
            }
          }, 50);
        }

        start();
      })();
    </script>
  </body>
</html>
