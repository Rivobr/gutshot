<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>GUTSHOT</title>
    <!-- Сразу гасим нативный лоадер Telegram. WebView уже инжектит Telegram.WebApp. -->
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor('#090909');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#090909');
          if (tg.setBottomBarColor) tg.setBottomBarColor('#090909');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #090909;
        color: #c9a227;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #s {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: flex-end;
        gap: 8px;
        height: 48px;
      }
      .logo i {
        display: block;
        width: 10px;
        height: 48px;
        border-radius: 3px;
        background: linear-gradient(150deg, #7d5417 0%, #c89a3d 42%, #f7d98a 58%, #8a5c1c 100%);
      }
      .logo i.r {
        background: linear-gradient(150deg, #7a0b2c 0%, #e0115f 45%, #ff4d7d 60%, #a10d3d 100%);
      }
      .msg {
        font-size: 14px;
        opacity: 0.85;
        max-width: 280px;
        line-height: 1.4;
      }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #c9a227;
        border-radius: 50%;
        animation: r 0.8s linear infinite;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        display: none;
        margin-top: 8px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: #c9a227;
        color: #111;
        font-weight: 700;
        font-size: 15px;
      }
      .btn.show {
        display: inline-block;
      }
    </style>
    <!-- CDN только запасной: не блокирует парсинг и ready(). -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  </head>
  <body>
    <div id="s">
      <div class="logo" aria-hidden="true"><i></i><i></i><i class="r"></i><i></i><i></i></div>
      <div class="spin" id="sp"></div>
      <div class="msg" id="m">Входим…</div>
      <button class="btn" id="b" type="button">Повторить</button>
    </div>
    <script>
      (function () {
        var TOKEN_KEY = 'gutshot_access_token';
        var FETCH_MS = 10000;
        var params = new URLSearchParams(location.search);
        var ticket = params.get('ticket') || '';
        var m = document.getElementById('m');
        var b = document.getElementById('b');
        var sp = document.getElementById('sp');
        var done = false;
        var hardTimer = setTimeout(function () {
          if (!done) fail('Загрузка зависла. Нажмите «Повторить» или /start в боте.');
        }, 18000);

        function bumpTg() {
          try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return null;
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#090909');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#090909');
            if (tg.setBottomBarColor) tg.setBottomBarColor('#090909');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            if (tg.requestFullscreen && (!tg.isVersionAtLeast || tg.isVersionAtLeast('8.0'))) {
              if (!tg.isFullscreen) tg.requestFullscreen();
            }
            return tg;
          } catch (e) {
            return null;
          }
        }

        function appUrl() {
          var q = '/?from=enter&t=' + Date.now() + '&v=20260806c';
          if (ticket) q += '&ticket=' + encodeURIComponent(ticket);
          return q + (location.hash || '');
        }

        function goApp() {
          if (done) return;
          done = true;
          clearTimeout(hardTimer);
          location.replace(appUrl());
        }

        function fail(text) {
          done = false;
          clearTimeout(hardTimer);
          sp.style.display = 'none';
          m.textContent = text;
          b.classList.add('show');
        }

        function getInitData() {
          try {
            return (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
          } catch (e) {
            return '';
          }
        }

        function fetchJson(path, body, attempt) {
          attempt = attempt || 1;
          m.textContent = attempt > 1 ? 'Повтор входа… ' + attempt : 'Входим…';
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timer = ctrl
            ? setTimeout(function () {
                try {
                  ctrl.abort();
                } catch (e) {}
              }, FETCH_MS)
            : null;

          return fetch(path, {
            method: 'POST',
            cache: 'no-store',
            credentials: 'omit',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: ctrl ? ctrl.signal : undefined,
          })
            .then(function (r) {
              if (timer) clearTimeout(timer);
              if (r.status === 401) {
                var fatal = new Error('http 401');
                fatal.fatal = true;
                throw fatal;
              }
              if (!r.ok) throw new Error('http ' + r.status);
              return r.json();
            })
            .then(function (json) {
              var token = json && json.data && json.data.accessToken;
              if (!token) throw new Error('no token');
              try {
                localStorage.setItem(TOKEN_KEY, token);
              } catch (e) {}
              m.textContent = 'Открываем клуб…';
              goApp();
            })
            .catch(function (err) {
              if (timer) clearTimeout(timer);
              if (err && err.fatal) throw err;
              if (attempt < 2) {
                return new Promise(function (resolve) {
                  setTimeout(resolve, 400);
                }).then(function () {
                  return fetchJson(path, body, attempt + 1);
                });
              }
              throw err;
            });
        }

        function loginWithInitData(initData) {
          return fetchJson('/api/v1/auth/telegram', { initData: initData });
        }

        function loginWithTicket(value) {
          return fetchJson('/api/v1/auth/telegram/ticket', { ticket: value });
        }

        function validateCachedToken() {
          var token = null;
          try {
            token = localStorage.getItem(TOKEN_KEY);
          } catch (e) {}
          if (!token) return Promise.reject(new Error('no token'));

          m.textContent = 'Проверяем сессию…';
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timer = ctrl
            ? setTimeout(function () {
                try {
                  ctrl.abort();
                } catch (e) {}
              }, FETCH_MS)
            : null;

          return fetch('/api/v1/profile', {
            method: 'GET',
            cache: 'no-store',
            credentials: 'omit',
            headers: { Authorization: 'Bearer ' + token },
            signal: ctrl ? ctrl.signal : undefined,
          }).then(function (r) {
            if (timer) clearTimeout(timer);
            if (!r.ok) {
              try {
                localStorage.removeItem(TOKEN_KEY);
              } catch (e) {}
              throw new Error('stale token');
            }
            m.textContent = 'Открываем клуб…';
            goApp();
          });
        }

        b.onclick = function () {
          done = false;
          sp.style.display = 'block';
          b.classList.remove('show');
          hardTimer = setTimeout(function () {
            if (!done) fail('Загрузка зависла. Нажмите «Повторить» или /start в боте.');
          }, 18000);
          start();
        };

        function waitInitDataOrFail() {
          var tries = 0;
          var timer = setInterval(function () {
            tries += 1;
            bumpTg();
            var initData = getInitData();
            if (initData) {
              clearInterval(timer);
              loginWithInitData(initData).catch(function () {
                fail('Не удалось войти. Нажмите /start в боте и откройте новой кнопкой.');
              });
              return;
            }
            if (tries >= 50) {
              clearInterval(timer);
              if (ticket) {
                loginWithTicket(ticket).catch(function () {
                  fail('Ссылка устарела. Нажмите /start в боте и откройте новой кнопкой.');
                });
                return;
              }
              fail('Откройте приложение кнопкой из бота.');
            }
          }, 50);
        }

        function start() {
          bumpTg();
          // CDN-скрипт мог подгрузиться чуть позже — ещё раз ready.
          setTimeout(bumpTg, 100);
          setTimeout(bumpTg, 500);

          var initData = getInitData();
          if (initData) {
            loginWithInitData(initData).catch(function () {
              if (ticket) {
                return loginWithTicket(ticket).catch(function () {
                  fail('Не удалось войти. Нажмите /start в боте и откройте новой кнопкой.');
                });
              }
              fail('Не удалось войти. Закройте и откройте кнопкой из бота.');
            });
            return;
          }

          if (ticket) {
            loginWithTicket(ticket).catch(function () {
              waitInitDataOrFail();
            });
            return;
          }

          validateCachedToken().catch(function () {
            waitInitDataOrFail();
          });
        }

        start();
      })();
    </script>
  </body>
</html>
