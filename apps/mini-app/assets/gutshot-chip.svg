<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <title>GUTSHOT Poker Club Chip 10 000</title>
  <defs>
    <linearGradient id="goldBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B06A"/>
      <stop offset="40%" stop-color="#A07828"/>
      <stop offset="100%" stop-color="#6B4A12"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4D5E"/>
      <stop offset="45%" stop-color="#E0112F"/>
      <stop offset="100%" stop-color="#8A0A1C"/>
    </linearGradient>
    <!--
      Чёрное пятно обода как на физической фишке:
      внешняя дуга + два «зуба» к центру, лёгкий часовой разворот.
    -->
    <path
      id="spot"
      d="M256 22
         C300 24 338 42 352 68
         C328 82 306 104 298 132
         C286 104 274 86 256 76
         C238 86 226 104 214 132
         C206 104 184 82 160 68
         C174 42 212 24 256 22 Z"
    />
  </defs>

  <!-- Тонкий внешний кант -->
  <circle cx="256" cy="256" r="255" fill="#0B0B0B"/>

  <!-- Зелёный корпус -->
  <circle cx="256" cy="256" r="248" fill="#2FBF3A"/>

  <!-- 6 одинаковых чёрных пятен -->
  <g fill="#0A0A0A">
    <use href="#spot" transform="rotate(0 256 256)"/>
    <use href="#spot" transform="rotate(60 256 256)"/>
    <use href="#spot" transform="rotate(120 256 256)"/>
    <use href="#spot" transform="rotate(180 256 256)"/>
    <use href="#spot" transform="rotate(240 256 256)"/>
    <use href="#spot" transform="rotate(300 256 256)"/>
  </g>

  <!-- Золотое кольцо вокруг центра -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="#C89A3D" stroke-width="2" opacity="0.5"/>

  <!-- Тёмный посадочный кант -->
  <circle cx="256" cy="256" r="170" fill="#121212"/>

  <!-- Белый центр (как на фото) -->
  <circle cx="256" cy="256" r="162" fill="#FFFFFF"/>

  <!-- BrandMark: 5 полосок, центральная красная -->
  <g>
    <rect x="212" y="122" width="11" height="40" rx="2.8" fill="url(#goldBar)"/>
    <rect x="229" y="122" width="11" height="40" rx="2.8" fill="url(#goldBar)"/>
    <rect x="246" y="122" width="11" height="40" rx="2.8" fill="url(#redBar)"/>
    <rect x="263" y="122" width="11" height="40" rx="2.8" fill="url(#goldBar)"/>
    <rect x="280" y="122" width="11" height="40" rx="2.8" fill="url(#goldBar)"/>
  </g>

  <!-- GUTSHOT -->
  <text
    x="256"
    y="204"
    text-anchor="middle"
    fill="#8B6914"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="44"
    font-weight="700"
    letter-spacing="0.16em"
  >GUTSHOT</text>

  <!-- — POKER CLUB — -->
  <text
    x="256"
    y="232"
    text-anchor="middle"
    fill="#8B6914"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12.5"
    font-weight="600"
    letter-spacing="0.24em"
  >— POKER CLUB —</text>

  <!-- 10 000 -->
  <text
    x="256"
    y="318"
    text-anchor="middle"
    fill="#111111"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="58"
    font-weight="700"
    letter-spacing="0.04em"
  >10 000</text>
</svg>
