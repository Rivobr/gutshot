server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Маркер: через curl -I видно, что это mini-app, а не admin.
    add_header X-Gutshot-App mini-app always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Same-origin API proxy — Cloudflare Tunnel ведёт app на :8080, минуя edge nginx.
    location /api/ {
        proxy_pass http://gutshot-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    # Хэшированные ассеты Vite — долгий кеш.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Gutshot-App mini-app always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Gutshot-App mini-app always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
