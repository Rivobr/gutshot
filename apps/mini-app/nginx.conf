server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Маркер: через curl -I видно, что это mini-app, а не admin.
    add_header X-Gutshot-App mini-app always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Хэшированные ассеты Vite — долгий кеш.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Gutshot-App mini-app always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Gutshot-App mini-app always;
    }

    # HTML оболочки не кешируем: иначе Telegram WebView может держать
    # старый index с битыми ссылками на /assets/* после деплоя.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Gutshot-App mini-app always;
        try_files $uri $uri/ /index.html;
    }
}
