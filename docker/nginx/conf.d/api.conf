server {
    listen 80;
    server_name api.gutshotapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.gutshotapp.ru;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    keepalive_timeout 10s;
    keepalive_requests 1;
    lingering_close off;

    # TV APK — только GitHub Release
    location = /downloads/gutshot-tv-offline.apk {
        return 302 https://github.com/Rivobr/gutshot/releases/download/tv-offline-latest/gutshot-tv-offline.apk;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }
}
