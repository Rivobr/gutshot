# Прямой вход в клуб БЕЗ Cloudflare / VPN.
# Xiaomi TV / ноут по HDMI: http://159.194.208.116/
# (сервер в РФ, Beget — браузер ходит напрямую)
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;
    set $tv_upstream http://gutshot-tv:80;

    gzip off;

    # Служебная проверка связи
    location = /ok.html {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>OK</title></head><body style="background:#111;color:#0f0;font:bold 48px sans-serif;text-align:center;padding:20vh 0">СВЯЗЬ ЕСТЬ</body></html>';
    }

    # Same-origin API для табло по IP
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # По IP сразу табло турнира.
    # Админка без VPN: http://159.194.208.116:8081
    # или https://admin.gutshotapp.ru
    location / {
        proxy_pass $tv_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
