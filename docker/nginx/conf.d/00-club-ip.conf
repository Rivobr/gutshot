# Прямой вход по IP БЕЗ Cloudflare / VPN: http://159.194.208.116/
# Табло в зале больше не веб-страница — на телевизорах офлайн-приложение
# (apps/tv-offline), поэтому по IP отдаём только служебную проверку связи.
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;

    gzip off;

    # Служебная проверка связи
    location = /ok.html {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>OK</title></head><body style="background:#111;color:#0f0;font:bold 48px sans-serif;text-align:center;padding:20vh 0">СВЯЗЬ ЕСТЬ</body></html>';
    }

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Админка без VPN: http://159.194.208.116:8081 или https://admin.gutshotapp.ru
    location / {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUTSHOT</title></head><body style="margin:0;background:#090909;color:#c9a227;font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center"><div style="font-size:26px;font-weight:800">GUTSHOT</div><div style="font-size:15px;opacity:.8">Табло в зале работает в приложении на телевизоре</div><div style="font-size:13px;opacity:.6">Админка: :8081</div></body></html>';
    }
}
