# Публичный сайт-визитка / PWA (контейнер gutshot-web, apps/web).
# Канонический домен — gutshotapp.ru; www всегда редиректит на него.
server {
    listen 80;
    server_name gutshotapp.ru www.gutshotapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gutshotapp.ru$request_uri;
    }
}

server {
    # HTTP/1.1 only — HTTP/2 вешает часть мобильных WebView.
    listen 443 ssl;
    http2 off;
    server_name gutshotapp.ru www.gutshotapp.ru;

    # Docker embedded DNS — re-resolve после пересоздания контейнеров.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://gutshot-web:80;
    set $api_upstream http://gutshot-api:3000;

    ssl_certificate /etc/letsencrypt/live/gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    keepalive_timeout 10s;
    keepalive_requests 1;
    lingering_close off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # www → канонический домен
    if ($host = www.gutshotapp.ru) {
        return 301 https://gutshotapp.ru$request_uri;
    }

    location /api/ {
        # С переменными nginx не дополняет URI — передаём $request_uri явно.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
