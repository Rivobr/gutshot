# Админка для Xiaomi TV / браузеров, которые не умеют Cloudflare.
# Открывать: https://tv.gutshotapp.ru:8443
# (tv.* идёт напрямую на VPS — как обычное табло на :80)
# Внимание: :8443 = АДМИНКА, :80 = ТАБЛО. Не путать.
server {
    listen 8443 ssl;
    server_name tv.gutshotapp.ru;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;
    set $admin_upstream http://gutshot-admin:80;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    keepalive_timeout 75s;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    location / {
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
