server {
    listen 80;
    server_name app.gutshotapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/1.1 only — HTTP/2 caused zero-hit hangs for some iOS Telegram WebViews.
    listen 443 ssl;
    server_name app.gutshotapp.ru;

    # Docker embedded DNS — re-resolve after container recreate (avoids stale IP → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mini_upstream http://gutshot-mini-app:80;
    set $api_upstream http://gutshot-api:3000;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # One request per connection: iOS Telegram WebView hits bad record mac
    # when reusing TLS keepalive for the next request (auth dies after static).
    keepalive_timeout 10s;
    keepalive_requests 1;
    lingering_close off;

    location = /y.html {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /t.html {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /enter.html {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /__boot.gif {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log /var/log/nginx/boot_ping.log;
    }

    location = /go.html {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /boot.html {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Inline diagnostics — без proxy на mini-app.
    location = /ping.html {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OK</title></head><body style="margin:0;background:#0a0;color:#fff;font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="font-size:28px;font-weight:800">GUTSHOT</div><div style="font-size:18px">СВЯЗЬ ЕСТЬ</div></body></html>';
    }

    location = /red.html {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RED</title><script>try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}}catch(e){}</script></head><body bgcolor="#FF0000" text="#FFFFFF" style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif"><div style="font-size:42px;font-weight:900">КРАСНЫЙ</div><div style="font-size:22px;margin-top:12px">СВЯЗЬ ЕСТЬ</div></body></html>';
    }

    # TV APK — только GitHub Release (не раздаём с app)
    location = /tv.apk {
        return 302 https://github.com/Rivobr/gutshot/releases/download/tv-offline-latest/gutshot-tv-offline.apk;
    }

    location = /tv {
        return 302 https://github.com/Rivobr/gutshot/releases/download/tv-offline-latest/gutshot-tv-offline.apk;
    }

    location = /downloads/gutshot-tv-offline.apk {
        return 302 https://github.com/Rivobr/gutshot/releases/download/tv-offline-latest/gutshot-tv-offline.apk;
    }

    location /api/ {
        # With variables nginx does not append URI — pass $request_uri explicitly.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass $mini_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
