server {
    listen 80;
    server_name app.gutshotapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/1.1 only — HTTP/2 caused zero-hit hangs for some iOS Telegram WebViews.
    listen 443 ssl;
    server_name app.gutshotapp.ru;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # One request per connection: iOS Telegram WebView hits bad record mac
    # when reusing TLS keepalive for the next request (auth dies after static).
    keepalive_timeout 10s;
    keepalive_requests 1;
    lingering_close off;

    location = /y.html {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /t.html {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /__boot.gif {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log /var/log/nginx/boot_ping.log;
    }

    location = /go.html {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://gutshot-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
