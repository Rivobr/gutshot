server {
    listen 80;
    server_name app.gutshotapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.gutshotapp.ru;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Boot ping — видно, выполнился ли inline JS в WebView
    location = /__boot.gif {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log /var/log/nginx/boot_ping.log;
    }

    location / {
        # ТОЛЬКО mini-app. Никогда не proxy на gutshot-admin —
        # иначе в боте открывается CRM и «вечная загрузка».
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
