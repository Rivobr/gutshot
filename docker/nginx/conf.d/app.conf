server {
    listen 80;
    server_name app.gutshotapp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.gutshotapp.ru;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # Короткий keepalive: полный 0 ломает iOS на каждом ассете (новый TLS),
    # длинный даёт bad record mac. 2s — компромисс.
    keepalive_timeout 2s;
    lingering_close off;

    location = /y.html {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /__boot.gif {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log /var/log/nginx/boot_ping.log;
    }

    location = /go.html {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # API — без reuse соединения (POST consent/auth на iOS рвались на keepalive)
    location /api/ {
        proxy_pass http://gutshot-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://gutshot-mini-app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
