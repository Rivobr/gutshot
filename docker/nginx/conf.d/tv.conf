# Docker DNS — иначе после recreate api/tv/admin nginx держит старые IP
# и tv.* может начать отдавать админку (и наоборот).
# Переменные в proxy_pass заставляют резолвить upstream на каждый запрос.
# ВАЖНО: с переменными нельзя писать proxy_pass $host/path/ — URI обрежется.
# Нужно: proxy_pass $host$request_uri; или proxy_pass $host; без суффикса.

server {
    listen 80;
    server_name tv.gutshotapp.ru;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;
    set $tv_upstream http://gutshot-tv:80;

    # На клубном VPN gzip/chunked иногда рвут HTML табло mid-stream.
    gzip off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTP без редиректа на HTTPS — браузер Xiaomi часто ломается на TLS.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    location / {
        proxy_pass $tv_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering on;
    }
}

server {
    listen 443 ssl;
    server_name tv.gutshotapp.ru;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gutshot-api:3000;
    set $tv_upstream http://gutshot-tv:80;

    gzip off;

    ssl_certificate /etc/letsencrypt/live/api.gutshotapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gutshotapp.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    keepalive_timeout 75s;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    location / {
        proxy_pass $tv_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_buffering on;
    }
}
